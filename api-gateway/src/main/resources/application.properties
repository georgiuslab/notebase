spring.application.name=api-gateway

server.port=8080

spring.cloud.gateway.routes[0].id=${GATEWAY_ID}
spring.cloud.gateway.routes[0].uri=${GATEWAY_URI}
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/**
spring.cloud.gateway.routes[0].filters[0]=TokenRelay=

server.forward-headers-strategy=framework
server.tomcat.remote-ip-header=X-Forwarded-For
server.tomcat.protocol-header=X-Forwarded-Proto

spring.security.oauth2.client.provider.keycloak.issuer-uri=${ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}
spring.security.oauth2.client.provider.keycloak.user-name-attribute=email

spring.security.oauth2.client.registration.keycloak.client-id=${CLIENT_ID}
spring.security.oauth2.client.registration.keycloak.client-secret=${CLIENT_SECRET}
spring.security.oauth2.client.registration.keycloak.scope=openid, profile, email
spring.security.oauth2.client.registration.keycloak.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.keycloak.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.security=DEBUG

logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.springframework.security.web=DEBUG

server.reactive.session.cookie.domain=.chemilabi.trade
server.reactive.session.cookie.secure=true
server.reactive.session.cookie.same-site=lax

app.frontend-url=${FRONTEND_URL}
