spring.application.name=notebase-backend

server.port=8081

spring.security.oauth2.resourceserver.jwt.issuer-uri=${ISSUER_URI}

#DB
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.allowed-email-domain=sangu.edu.ge

#SWAGGER#
springdoc.swagger-ui.enabled=false
springdoc.api-docs.path=${SWAGGER_PATH}
server.uri=${SWAGGER_URI}

#AWS#
aws.s3.bucket-name=${BUCKET_NAME}
aws.s3.region=${S3_REGION}
aws.credentials.access-key=${AWS_CREDENTIALS_ACCESS_KEY}
aws.credentials.secret-key=${AWS_CREDENTIALS_SECRET_KEY}

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always